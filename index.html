<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/leap-atitle.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LEAP-A | Labor Engagement and Analytics Platform for Administration</title>
    <meta
      name="description"
      content="LEAP-A is the HR and employee management platform of the Lipa City Personnel Office, covering leave, training, hiring, and analytics."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#800000" />

    <!-- Connect early to the servers the login page needs -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://leap-a-production.up.railway.app" crossorigin />

    <!-- Start downloading the login logo immediately -->
    <link rel="preload" as="image" href="/leaplogo.webp" fetchpriority="high" />

    <!-- Fonts: one request, loaded without blocking the page -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
